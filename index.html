<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mainframe - Eye Tracker</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 28px;
      letter-spacing: -1px;
    }

    p {
      color: #a1a1aa;
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 14px;
    }

    /* Container for the character image */
    .character-wrapper {
      position: relative;
      width: 320px;
      height: 560px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Your character image */
    .character-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Overlay container positioned directly over the eyes */
    .eyes-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Eye socket styling and placement */
    .eye {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Left Eye Position on the character */
    .eye.left {
      top: 30.5%;
      left: 44.5%;
    }

    /* Right Eye Position on the character */
    .eye.right {
      top: 30.5%;
      left: 54.5%;
    }

    /* Pupil dot that moves with the cursor */
    .pupil {
      width: 8px;
      height: 8px;
      background-color: #1a0d00;
      border-radius: 50%;
      position: absolute;
      transition: transform 0.04s ease-out;
    }
  </style>
</head>
<body>

  <h1>Mainframe®</h1>
  <p>Move your mouse around to see her follow your cursor</p>

  <div class="character-wrapper">
    <!-- Make sure your character image is saved in the same folder as "character.png" -->
    <img src="character.png" alt="Character" class="character-img">
    
    <!-- Transparent eyes tracking layer -->
    <div class="eyes-layer">
      <div class="eye left"><div class="pupil"></div></div>
      <div class="eye right"><div class="pupil"></div></div>
    </div>
  </div>

  <script>
    const pupils = document.querySelectorAll('.pupil');

    window.addEventListener('mousemove', (e) => {
      pupils.forEach((pupil) => {
        // Calculate the center point of each eye
        const rect = pupil.getBoundingClientRect();
        const eyeX = rect.left + rect.width / 2;
        const eyeY = rect.top + rect.height / 2;

        // Find angle between cursor and eye
        const angle = Math.atan2(e.clientY - eyeY, e.clientX - eyeX);
        const distance = 4; // Maximum pixels the pupil can shift

        // Move pupil towards the cursor angle
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;

        pupil.style.transform = `translate(${x}px, ${y}px)`;
      });
    });
  </script>
</body>
</html>
